name: Auto Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  select-release:
    name: Determine release type
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.label.outputs.bump }}
    steps:
      - name: Read release label
        id: label
        uses: actions/github-script@v7
        with:
          script: |
            const releaseLabels = ['release:patch', 'release:minor', 'release:major'];
            const labels = (context.payload.pull_request.labels || []).map((label) => label.name);
            const selected = labels.filter((label) => releaseLabels.includes(label));

            if (selected.length > 1) {
              core.setFailed(`Choose exactly one release label; found: ${selected.join(', ')}`);
              return;
            }

            if (selected.length === 0) {
              core.notice('No release:* label on this PR; release skipped.');
              core.setOutput('bump', '');
              return;
            }

            core.setOutput('bump', selected[0].replace('release:', ''));
            core.notice(`Release type: ${selected[0]}`);

  release:
    name: Test and publish release tag
    needs: select-release
    if: needs.select-release.outputs.bump != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Serialize releases. A failed push can be safely rerun from the Actions UI.
    concurrency:
      group: pin-context-auto-release-main
      cancel-in-progress: false
    steps:
      - name: Check out main with tags
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Run formatting, lint, typecheck, build, and unit/smoke tests
        run: npm run precommit:check

      - name: Install VS Code integration test runner
        run: npm run test:integration:install

      - name: Run tests in a real VS Code Extension Host
        run: xvfb-run -a npm run test:integration

      - name: Bump version, update changelog, build VSIX, commit and tag
        env:
          RELEASE_BUMP: ${{ needs.select-release.outputs.bump }}
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_PR_TITLE: ${{ github.event.pull_request.title }}
          RELEASE_PR_URL: ${{ github.event.pull_request.html_url }}
        run: npx tsx scripts/autoRelease.ts

      - name: Read release version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Pin Context v${{ steps.version.outputs.version }}
          files: pin-context-*.vsix
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          if [[ -z "${VSCE_PAT:-}" ]]; then
            echo "VSCE_PAT is not configured; skipping Marketplace publication. The VSIX is attached to the GitHub Release."
            exit 0
          fi
          npx vsce publish --no-dependencies
